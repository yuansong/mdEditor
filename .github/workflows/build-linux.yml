name: Build Linux (mdEditor)

# 在 GitHub 托管的 Ubuntu 上编译 mdEditor 的 Linux 版本（AppImage；可选 .deb）。
#
# 触发：
#   - 推送到 main 分支自动触发
#   - 也可在 Actions 页面手动「Run workflow」触发（workflow_dispatch）
#   - 打 `v*` 标签（如 v3.48.39）时也会触发，便于发版
#
# 产物（Artifacts，保留 7 天）：
#   - mdEditor-Linux-AppImage : mdEditor-Linux-*.AppImage
#   - mdEditor-Linux-deb      : mdEditor_*.deb（仅 --deb 时）
#   - mdEditor-Linux-build-logs : PyInstaller 构建日志

on:
  push:
    branches: [ main, ui-optimize-5 ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip build-essential \
            libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libnss3 libxcomposite1 libxrandr2 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxdamage1 libxshmfence1 fuse libfuse2 patchelf

      - name: Build AppImage (+ .deb)
        env:
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: bash build_linux.sh --deb

      - name: List dist / installer (诊断)
        if: always()
        run: |
          echo "== dist =="; ls -la dist 2>/dev/null || true
          echo "== installer =="; ls -la installer 2>/dev/null || true

      - name: Upload AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdEditor-Linux-AppImage
          path: installer/mdEditor-Linux-*.AppImage
          if-no-files-found: warn

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdEditor-Linux-deb
          path: installer/mdeditor_*.deb
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdEditor-Linux-build-logs
          path: |
            build/
            _build*.log
          if-no-files-found: ignore
