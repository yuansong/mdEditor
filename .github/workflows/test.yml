name: Test (mdEditor)

# 轻量、快速的核心校验，在每次 push 与 PR 上运行，给贡献者即时反馈。
# 仅做离线可跑的两段：内核脚本语法检查 + Node 内核单测（不需要 PySide6 / 显示器）。
# 重型 GUI 探针（tests/_run_full.py）依赖本机 venv，不在 CI 跑。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Editor core syntax check
        run: python tests/_syntax_check.py

      - name: Node core unit tests
        run: node tests/test_core.js
