name: Welcome

# 给首次贡献者 / 首次提 Issue 的人一个友善欢迎，降低上手门槛。
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            感谢你提交 Issue！👋
            我们会尽快查看。提交前若还没读过，欢迎浏览：
            - 快速上手：[README.md](https://github.com/yuansong/mdEditor/blob/main/README.md)
            - 开发规范：[AGENTS.md](https://github.com/yuansong/mdEditor/blob/main/AGENTS.md)
            - 路线图：[ROADMAP.md](https://github.com/yuansong/mdEditor/blob/main/ROADMAP.md)
          pr-message: |
            感谢你的第一个 PR！🎉
            请确认已勾选 PR 模板中的自检清单（尤其是跑通语法检查与内核单测、同步文档）。
            维护者会尽快 review。
