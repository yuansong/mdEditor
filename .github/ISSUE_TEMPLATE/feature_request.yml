name: 功能建议 / Feature Request
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题 / Problem
      description: 这个需求来自什么痛点？现在怎么不方便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望 mdEditor 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 有没有其它思路或 workaround？
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Context
      description: 截图、竞品参考、使用场景等
